[package]
name = "diskann-filter-lab"
description = "Research lab for filtered approximate nearest neighbor search: label stores, AND-of-OR predicates and exact filtered ground truth."
version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "flab"
path = "src/main.rs"

[[bin]]
name = "flab-upstream"
path = "src/bin/flab_upstream.rs"

[dependencies]
anyhow.workspace = true
bytemuck = { workspace = true, features = ["derive"] }
clap = { workspace = true, features = ["derive"] }
diskann.workspace = true
diskann-providers.workspace = true
diskann-vector.workspace = true
hashbrown.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[lints]
workspace = true

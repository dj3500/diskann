[package]
name = "diskann-filter-lab"
description = "Research lab for filtered approximate nearest neighbor search: label stores, AND-of-OR predicates and exact filtered ground truth."
version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "flab"
path = "src/main.rs"

[[bin]]
name = "flab-upstream"
path = "src/bin/flab_upstream.rs"

[features]
# Profiling builds: cycle counts of the post-filter loop's phases (`kernel::profile`), reported
# by `flab run` per configuration and effort.
phase-profile = []

[dependencies]
anyhow.workspace = true
bytemuck = { workspace = true, features = ["derive"] }
clap = { workspace = true, features = ["derive"] }
diskann.workspace = true
diskann-providers.workspace = true
diskann-vector.workspace = true
hashbrown.workspace = true
libc = "0.2.189"
rayon.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
toml = "0.8.23"
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
diskann.workspace = true
diskann-providers = { workspace = true, features = ["virtual_storage"] }
diskann-utils.workspace = true
tokio = { workspace = true, features = ["rt"] }

[lints]
workspace = true
